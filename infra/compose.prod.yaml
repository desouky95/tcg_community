name: tcg-prod

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to your Docker Hub image and release tag}
  restart: unless-stopped

services:
  backend:
    <<: *app
    environment:
      MEDUSA_ADMIN_ONBOARDING_TYPE: ${BACKEND_MEDUSA_ADMIN_ONBOARDING_TYPE:-}
      STORE_CORS: ${BACKEND_STORE_CORS:-}
      ADMIN_CORS: ${BACKEND_ADMIN_CORS:-}
      AUTH_CORS: ${BACKEND_AUTH_CORS:-}
      REDIS_URL: ${BACKEND_REDIS_URL:-}
      JWT_SECRET: ${BACKEND_JWT_SECRET:-}
      COOKIE_SECRET: ${BACKEND_COOKIE_SECRET:-}
      AUTH_MFA_ENCRYPTION_KEY: ${BACKEND_AUTH_MFA_ENCRYPTION_KEY:-}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-}
      MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY: ${BACKEND_MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY:-}
      VITE_CARD_CATALOG_URL: ${BACKEND_VITE_CARD_CATALOG_URL:-}
      VITE_CARD_CATALOG_API_KEY: ${BACKEND_VITE_CARD_CATALOG_API_KEY:-}
      DB_NAME: ${BACKEND_DB_NAME:-}
      STRAPI_SYNC_URL: ${BACKEND_STRAPI_SYNC_URL:-}
      STRAPI_SYNC_TOKEN: ${BACKEND_STRAPI_SYNC_TOKEN:-}
      EVENTS_REDIS_URL: ${BACKEND_EVENTS_REDIS_URL:-}
      NODE_ENV: ${BACKEND_NODE_ENV:-}
      CARD_CATALOG_API_KEY: ${BACKEND_CARD_CATALOG_API_KEY:-}
      NEXT_PULL_SERVICE_KEY: ${BACKEND_NEXT_PULL_SERVICE_KEY:-}
      HOST: ${BACKEND_HOST:-}
      PORT: ${BACKEND_PORT:-}
    ports:
      - '9000:9000'

  public-web:
    <<: *app
    working_dir: /srv/public-web
    command: ["node", "apps/public-web/server.js"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_WEB_NEXT_PUBLIC_BASE_URL:-}
      NEXT_PUBLIC_STRIPE_KEY: ${PUBLIC_WEB_NEXT_PUBLIC_STRIPE_KEY:-}
      MEDUSA_CLOUD_S3_HOSTNAME: ${PUBLIC_WEB_MEDUSA_CLOUD_S3_HOSTNAME:-}
      MEDUSA_CLOUD_S3_PATHNAME: ${PUBLIC_WEB_MEDUSA_CLOUD_S3_PATHNAME:-}
      NODE_ENV: ${PUBLIC_WEB_NODE_ENV:-}
      AUTH_COOKIE_NAME: ${PUBLIC_WEB_AUTH_COOKIE_NAME:-}
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-}
      STRAPI_API_TOKEN: ${PUBLIC_WEB_STRAPI_API_TOKEN:-}
      BETTER_AUTH_SECRET: ${PUBLIC_WEB_BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${PUBLIC_WEB_BETTER_AUTH_URL:-}
      SOCIAL_AUTH_BRIDGE_SECRET: ${PUBLIC_WEB_SOCIAL_AUTH_BRIDGE_SECRET:-}
      GOOGLE_CLIENT_ID: ${PUBLIC_WEB_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${PUBLIC_WEB_GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${PUBLIC_WEB_FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${PUBLIC_WEB_FACEBOOK_CLIENT_SECRET:-}
      API_URL: ${PUBLIC_WEB_API_URL:-}
      HOSTNAME: ${PUBLIC_WEB_HOSTNAME:-}
      PORT: ${PUBLIC_WEB_PORT:-}
    ports:
      - '3000:3000'

  web:
    <<: *app
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - '5173:8080'

  api:
    <<: *app
    working_dir: /srv/api
    command: ["node", "bin/server.js"]
    environment:
      NODE_ENV: ${API_NODE_ENV:-}
      HOST: ${API_HOST:-}
      PORT: ${API_PORT:-}
      LOG_LEVEL: ${API_LOG_LEVEL:-}
      APP_KEY: ${API_APP_KEY:-}
      APP_URL: ${API_APP_URL:-}
      SESSION_DRIVER: ${API_SESSION_DRIVER:-}
      DB_HOST: ${API_DB_HOST:-}
      DB_PORT: ${API_DB_PORT:-}
      DB_USER: ${API_DB_USER:-}
      DB_PASSWORD: ${API_DB_PASSWORD:-}
      DB_DATABASE: ${API_DB_DATABASE:-}
      TEXT_BEE_API_KEY: ${API_TEXT_BEE_API_KEY:-}
      TEXT_BEE_DEVICE_ID: ${API_TEXT_BEE_DEVICE_ID:-}
      QUEUE_DRIVER: ${API_QUEUE_DRIVER:-}
      DRIVE_DISK: ${API_DRIVE_DISK:-}
      WEB_ORIGINS: ${API_WEB_ORIGINS:-}
      SESSION_COOKIE_DOMAIN: ${API_SESSION_COOKIE_DOMAIN:-}
      MEDUSA_INTERNAL_URL: ${API_MEDUSA_INTERNAL_URL:-}
      MEDUSA_SERVICE_KEY: ${API_MEDUSA_SERVICE_KEY:-}
      SCRAPER_TRIGGER_TOKEN: ${API_SCRAPER_TRIGGER_TOKEN:-}
      FIRECRAWL_API_KEY: ${API_FIRECRAWL_API_KEY:-}
      SWAPS_ENABLED: ${API_SWAPS_ENABLED:-}
      COLLECTOR_DISK_ENABLED: ${API_COLLECTOR_DISK_ENABLED:-}
      I_KEY: ${API_I_KEY:-}
      CARD_CATALOG_API_KEY: ${API_CARD_CATALOG_API_KEY:-}
      FACEBOOK_CLIENT_ID: ${API_FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${API_FACEBOOK_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${API_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${API_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_AUTH_BRIDGE_SECRET: ${API_SOCIAL_AUTH_BRIDGE_SECRET:-}
      PUBLIC_WEB_URL: ${API_PUBLIC_WEB_URL:-}
      COLLECTOR_APP_URL: ${API_COLLECTOR_APP_URL:-}
      MEDUSA_PUBLISHABLE_KEY: ${API_MEDUSA_PUBLISHABLE_KEY:-}
    ports:
      - '3333:3333'

  cms:
    <<: *app
    working_dir: /srv/cms
    command: ["./node_modules/.bin/strapi", "start"]
    environment:
      HOST: ${CMS_HOST:-}
      PORT: ${CMS_PORT:-}
      APP_KEYS: ${CMS_APP_KEYS:-}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:-}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:-}
      JWT_SECRET: ${CMS_JWT_SECRET:-}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:-}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:-}
      DATABASE_CLIENT: ${CMS_DATABASE_CLIENT:-}
      DATABASE_HOST: ${CMS_DATABASE_HOST:-}
      DATABASE_PORT: ${CMS_DATABASE_PORT:-}
      DATABASE_NAME: ${CMS_DATABASE_NAME:-}
      DATABASE_USERNAME: ${CMS_DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:-}
      DATABASE_SSL: ${CMS_DATABASE_SSL:-}
      DATABASE_FILENAME: ${CMS_DATABASE_FILENAME:-}
      MEDUSA_BACKEND_URL: ${CMS_MEDUSA_BACKEND_URL:-}
      MEDUSA_PUBLISHABLE_KEY: ${CMS_MEDUSA_PUBLISHABLE_KEY:-}
      NODE_ENV: ${CMS_NODE_ENV:-}
      DATABASE_SSL_CA: ${CMS_DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${CMS_DATABASE_SSL_REJECT_UNAUTHORIZED:-}
    ports:
      - '1337:1337'
    volumes:
      - cms-uploads:/srv/cms/public/uploads

volumes:
  cms-uploads:
