name: tcg-prod

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to your Docker Hub image and release tag}
  restart: unless-stopped

services:
  backend:
    <<: *app
    environment:
      MEDUSA_ADMIN_ONBOARDING_TYPE: ${MEDUSA_ADMIN_ONBOARDING_TYPE:-}
      STORE_CORS: ${STORE_CORS:-}
      ADMIN_CORS: ${ADMIN_CORS:-}
      AUTH_CORS: ${AUTH_CORS:-}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY: ${MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY:-}
      VITE_CARD_CATALOG_URL: ${VITE_CARD_CATALOG_URL:-}
      VITE_CARD_CATALOG_API_KEY: ${VITE_CARD_CATALOG_API_KEY:-}
      DB_NAME: ${DB_NAME:-}
      STRAPI_SYNC_URL: ${STRAPI_SYNC_URL:-}
      STRAPI_SYNC_TOKEN: ${STRAPI_SYNC_TOKEN:-}
      EVENTS_REDIS_URL: ${EVENTS_REDIS_URL:-}
      NODE_ENV: ${NODE_ENV:-}
      CARD_CATALOG_API_KEY: ${CARD_CATALOG_API_KEY:-}
      NEXT_PULL_SERVICE_KEY: ${NEXT_PULL_SERVICE_KEY:-}
      HOST: 0.0.0.0
      PORT: 9000
    ports:
      - '9000:9000'

  public-web:
    <<: *app
    working_dir: /srv/public-web
    command: ["node", "apps/public-web/server.js"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
      MEDUSA_CLOUD_S3_HOSTNAME: ${MEDUSA_CLOUD_S3_HOSTNAME:-}
      MEDUSA_CLOUD_S3_PATHNAME: ${MEDUSA_CLOUD_S3_PATHNAME:-}
      NODE_ENV: ${NODE_ENV:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-}
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      SOCIAL_AUTH_BRIDGE_SECRET: ${SOCIAL_AUTH_BRIDGE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      API_URL: ${API_URL:-}
      HOSTNAME: ${HOSTNAME:-}
      PORT: ${PORT:-}
    ports:
      - '3000:3000'

  web:
    <<: *app
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - '5173:8080'

  api:
    <<: *app
    working_dir: /srv/api
    command: ["node", "bin/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-}
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-}
      TEXT_BEE_API_KEY: ${TEXT_BEE_API_KEY:-}
      TEXT_BEE_DEVICE_ID: ${TEXT_BEE_DEVICE_ID:-}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-}
      DRIVE_DISK: ${DRIVE_DISK:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      MEDUSA_INTERNAL_URL: ${MEDUSA_INTERNAL_URL:-}
      MEDUSA_SERVICE_KEY: ${MEDUSA_SERVICE_KEY:-}
      SCRAPER_TRIGGER_TOKEN: ${SCRAPER_TRIGGER_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SWAPS_ENABLED: ${SWAPS_ENABLED:-}
      COLLECTOR_DISK_ENABLED: ${COLLECTOR_DISK_ENABLED:-}
      I_KEY: ${I_KEY:-}
      CARD_CATALOG_API_KEY: ${CARD_CATALOG_API_KEY:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SOCIAL_AUTH_BRIDGE_SECRET: ${SOCIAL_AUTH_BRIDGE_SECRET:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      COLLECTOR_APP_URL: ${COLLECTOR_APP_URL:-}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
    ports:
      - '3333:3333'

  cms:
    <<: *app
    working_dir: /srv/cms
    command: ["./node_modules/.bin/strapi", "start"]
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATABASE_CLIENT: ${DATABASE_CLIENT:-}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DATABASE_FILENAME: ${DATABASE_FILENAME:-}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      NODE_ENV: ${NODE_ENV:-}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-}
    ports:
      - '1337:1337'
    volumes:
      - cms-uploads:/srv/cms/public/uploads

volumes:
  cms-uploads:
