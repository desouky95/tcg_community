name: tcg-prod

services:
  bundle:
    image: ${APP_IMAGE:?Set APP_IMAGE to your registry image and release tag}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../.env
    ports:
      - '8080:8080'
    volumes:
      - cms-uploads:/srv/cms/public/uploads

volumes:
  cms-uploads:
