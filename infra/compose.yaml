name: tcg
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: .env.api
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      MEDUSA_INTERNAL_URL: http://backend:9000
    ports:
      - "${API_PORT:-3333}:3333"
    volumes:
      - api-storage:/workspace/apps/api/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
  cms:
    build:
      context: ..
      dockerfile: infra/Dockerfile.cms
    env_file: .env.cms
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      MEDUSA_BACKEND_URL: http://backend:9000
    ports:
      - "${CMS_PORT:-1337}:1337"
    volumes:
      - cms-uploads:/workspace/apps/cms/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file: .env.backend
    environment:
      STRAPI_SYNC_URL: http://cms:1337
      CARD_CATALOG_URL: http://api:3333/api/v1/internal/card-catalog
      VITE_CARD_CATALOG_URL: http://api:3333/api/v1/internal/card-catalog
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      - backend-static:/workspace/apps/backend/static
    extra_hosts:
      - "host.docker.internal:host-gateway"
  public-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.public-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-eg}
        NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
    env_file: .env.public-web
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_URL: http://api:3333/api/v1
    ports:
      - "${PUBLIC_WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  api-storage:
  cms-uploads:
  backend-static:
