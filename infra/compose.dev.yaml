name: tcg-dev

# Hot-reload dev: repo bind-mounted, host node_modules/build dirs masked by anonymous volumes.
# After lockfile changes: docker compose -f infra/compose.dev.yaml up --build -V
x-workspace-volumes: &workspace-volumes
  - ..:/workspace
  - /workspace/node_modules
  - /workspace/apps/backend/node_modules
  - /workspace/apps/public-web/node_modules
  - /workspace/apps/api/node_modules
  - /workspace/apps/cms/node_modules
  - /workspace/packages/api-contracts/node_modules
  - /workspace/packages/auth-client/node_modules
  - /workspace/packages/design-tokens/node_modules
  - /workspace/packages/locale/node_modules
  - /workspace/packages/react-query/node_modules
  - /workspace/packages/strapi-client/node_modules
  - /workspace/packages/ui-web/node_modules

x-dev: &dev
  build:
    context: ..
    target: dev
  image: tcg-dev-workspace
  restart: unless-stopped
  volumes: *workspace-volumes

services:
  backend:
    <<: *dev
    working_dir: /workspace/apps/backend
    command: pnpm dev
    env_file: .env.backend
    ports:
      - '9000:9000'
      - '24678:24678'
    volumes:
      - ..:/workspace
      - /workspace/node_modules
      - /workspace/apps/backend/node_modules
      - /workspace/apps/public-web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/cms/node_modules
      - /workspace/packages/api-contracts/node_modules
      - /workspace/packages/auth-client/node_modules
      - /workspace/packages/design-tokens/node_modules
      - /workspace/packages/locale/node_modules
      - /workspace/packages/react-query/node_modules
      - /workspace/packages/strapi-client/node_modules
      - /workspace/packages/ui-web/node_modules
      - /workspace/apps/backend/.medusa

  public-web:
    <<: *dev
    working_dir: /workspace/apps/public-web
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    env_file: .env.public-web
    ports:
      - '3000:3000'
    volumes:
      - ..:/workspace
      - /workspace/node_modules
      - /workspace/apps/backend/node_modules
      - /workspace/apps/public-web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/cms/node_modules
      - /workspace/packages/api-contracts/node_modules
      - /workspace/packages/auth-client/node_modules
      - /workspace/packages/design-tokens/node_modules
      - /workspace/packages/locale/node_modules
      - /workspace/packages/react-query/node_modules
      - /workspace/packages/strapi-client/node_modules
      - /workspace/packages/ui-web/node_modules
      - /workspace/apps/public-web/.next

  api:
    <<: *dev
    working_dir: /workspace/apps/api
    command: pnpm dev
    env_file: .env.api
    ports:
      - '3333:3333'

  cms:
    <<: *dev
    working_dir: /workspace/apps/cms
    command: pnpm dev
    env_file: .env.cms
    ports:
      - '1337:1337'
    volumes:
      - ..:/workspace
      - /workspace/node_modules
      - /workspace/apps/backend/node_modules
      - /workspace/apps/public-web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/cms/node_modules
      - /workspace/packages/api-contracts/node_modules
      - /workspace/packages/auth-client/node_modules
      - /workspace/packages/design-tokens/node_modules
      - /workspace/packages/locale/node_modules
      - /workspace/packages/react-query/node_modules
      - /workspace/packages/strapi-client/node_modules
      - /workspace/packages/ui-web/node_modules
      - /workspace/apps/cms/.strapi
      - /workspace/apps/cms/dist
      - cms-uploads:/workspace/apps/cms/public/uploads

volumes:
  cms-uploads:
