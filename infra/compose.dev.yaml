name: tcg-dev

# Hot-reload dev: repo bind-mounted, with dependency volumes shared across services.
# Refresh dependency volumes after manifest or lockfile changes (see deployment-and-recovery.md).
x-dependency-volume: &dependency-volume
  labels:
    nextpull.dev.dependencies: 'true'

x-workspace-volumes: &workspace-volumes
  - ..:/workspace
  - deps-workspace:/workspace/node_modules
  - deps-backend:/workspace/apps/backend/node_modules
  - deps-public-web:/workspace/apps/public-web/node_modules
  - deps-web:/workspace/apps/web/node_modules
  - deps-api:/workspace/apps/api/node_modules
  - deps-cms:/workspace/apps/cms/node_modules
  - deps-api-contracts:/workspace/packages/api-contracts/node_modules
  - deps-auth-client:/workspace/packages/auth-client/node_modules
  - deps-design-tokens:/workspace/packages/design-tokens/node_modules
  - deps-locale:/workspace/packages/locale/node_modules
  - deps-react-query:/workspace/packages/react-query/node_modules
  - deps-strapi-client:/workspace/packages/strapi-client/node_modules
  - deps-ui-web:/workspace/packages/ui-web/node_modules

x-dev: &dev
  build:
    context: ..
    target: dev
  image: tcg-dev-workspace
  env_file: ../.env.dev
  restart: unless-stopped
  volumes: *workspace-volumes

services:
  backend:
    <<: *dev
    working_dir: /workspace/apps/backend
    command: pnpm dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 9000
      BACKEND_VITE_CARD_CATALOG_URL: http://api:3333/api/v1/internal/card-catalog
    ports:
      - '9000:9000'
      - '24678:24678'
    volumes:
      - ..:/workspace
      - deps-workspace:/workspace/node_modules
      - deps-backend:/workspace/apps/backend/node_modules
      - deps-public-web:/workspace/apps/public-web/node_modules
      - deps-api:/workspace/apps/api/node_modules
      - deps-cms:/workspace/apps/cms/node_modules
      - deps-api-contracts:/workspace/packages/api-contracts/node_modules
      - deps-auth-client:/workspace/packages/auth-client/node_modules
      - deps-design-tokens:/workspace/packages/design-tokens/node_modules
      - deps-locale:/workspace/packages/locale/node_modules
      - deps-react-query:/workspace/packages/react-query/node_modules
      - deps-strapi-client:/workspace/packages/strapi-client/node_modules
      - deps-ui-web:/workspace/packages/ui-web/node_modules
      - /workspace/apps/backend/.medusa

  public-web:
    <<: *dev
    working_dir: /workspace/apps/public-web
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      PUBLIC_WEB_API_URL: http://api:3333/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ..:/workspace
      - deps-workspace:/workspace/node_modules
      - deps-backend:/workspace/apps/backend/node_modules
      - deps-public-web:/workspace/apps/public-web/node_modules
      - deps-api:/workspace/apps/api/node_modules
      - deps-cms:/workspace/apps/cms/node_modules
      - deps-api-contracts:/workspace/packages/api-contracts/node_modules
      - deps-auth-client:/workspace/packages/auth-client/node_modules
      - deps-design-tokens:/workspace/packages/design-tokens/node_modules
      - deps-locale:/workspace/packages/locale/node_modules
      - deps-react-query:/workspace/packages/react-query/node_modules
      - deps-strapi-client:/workspace/packages/strapi-client/node_modules
      - deps-ui-web:/workspace/packages/ui-web/node_modules
      - /workspace/apps/public-web/.next

  web:
    <<: *dev
    working_dir: /workspace/apps/web
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api/v1}
      VITE_PUBLIC_WEB_URL: ${VITE_PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - '5173:5173'
    volumes: *workspace-volumes

  api:
    <<: *dev
    working_dir: /workspace/apps/api
    command: pnpm dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      API_MEDUSA_INTERNAL_URL: http://backend:9000
    ports:
      - '3333:3333'

  cms:
    <<: *dev
    working_dir: /workspace/apps/cms
    command: pnpm dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      CMS_MEDUSA_BACKEND_URL: http://backend:9000
    ports:
      - '1337:1337'
    volumes:
      - ..:/workspace
      - deps-workspace:/workspace/node_modules
      - deps-backend:/workspace/apps/backend/node_modules
      - deps-public-web:/workspace/apps/public-web/node_modules
      - deps-api:/workspace/apps/api/node_modules
      - deps-cms:/workspace/apps/cms/node_modules
      - deps-api-contracts:/workspace/packages/api-contracts/node_modules
      - deps-auth-client:/workspace/packages/auth-client/node_modules
      - deps-design-tokens:/workspace/packages/design-tokens/node_modules
      - deps-locale:/workspace/packages/locale/node_modules
      - deps-react-query:/workspace/packages/react-query/node_modules
      - deps-strapi-client:/workspace/packages/strapi-client/node_modules
      - deps-ui-web:/workspace/packages/ui-web/node_modules
      - /workspace/apps/cms/.strapi
      - /workspace/apps/cms/dist
      - cms-uploads:/workspace/apps/cms/public/uploads

volumes:
  deps-workspace: *dependency-volume
  deps-backend: *dependency-volume
  deps-public-web: *dependency-volume
  deps-web: *dependency-volume
  deps-api: *dependency-volume
  deps-cms: *dependency-volume
  deps-api-contracts: *dependency-volume
  deps-auth-client: *dependency-volume
  deps-design-tokens: *dependency-volume
  deps-locale: *dependency-volume
  deps-react-query: *dependency-volume
  deps-strapi-client: *dependency-volume
  deps-ui-web: *dependency-volume
  cms-uploads:
