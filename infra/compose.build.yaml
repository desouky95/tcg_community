name: tcg-build

services:
  bundle:
    image: ${APP_IMAGE:?Set APP_IMAGE to your registry image and release tag}
    platform: ${APP_PLATFORM:-linux/amd64}
    build:
      context: ..
      target: app-platform
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:?Set NEXT_PUBLIC_STRAPI_API_URL}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?Set NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-eg}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL}
        VITE_PUBLIC_WEB_URL: ${VITE_PUBLIC_WEB_URL:?Set VITE_PUBLIC_WEB_URL}
