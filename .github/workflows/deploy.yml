name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push combined image
        env:
          APP_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRAPI_API_URL: ${{ vars.NEXT_PUBLIC_STRAPI_API_URL }}
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_REGION: ${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_WEB_URL: ${{ vars.VITE_PUBLIC_WEB_URL }}
        run: |
          : "${APP_IMAGE:?Set repository variable DOCKERHUB_IMAGE}"
          docker compose --env-file <(env | grep -E '^(APP_IMAGE|NEXT_PUBLIC_|VITE_)' | sed 's/^/ /') -f infra/compose.build.yaml build bundle
          docker image tag "$APP_IMAGE" "$APP_IMAGE:${GITHUB_SHA}"
          docker image push "$APP_IMAGE:${GITHUB_SHA}"
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'DEPLOY_HOST=%s\nDEPLOY_USER=%s\nAPP_IMAGE=%s\n' "$DEPLOY_HOST" "$DEPLOY_USER" "${{ vars.DOCKERHUB_IMAGE }}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Deploy on Droplet
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/tcg && APP_IMAGE='$APP_IMAGE' docker compose --env-file infra/.env.production -f infra/compose.prod.yaml pull && APP_IMAGE='$APP_IMAGE' docker compose --env-file infra/.env.production -f infra/compose.prod.yaml up -d"
