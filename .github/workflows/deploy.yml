name: Build and push Docker bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-bundle-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push combined image
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE || '5715/nextpull' }}
          PUBLIC_WEB_NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          PUBLIC_WEB_NEXT_PUBLIC_STRAPI_API_URL: ${{ vars.NEXT_PUBLIC_STRAPI_API_URL }}
          PUBLIC_WEB_NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          PUBLIC_WEB_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          PUBLIC_WEB_NEXT_PUBLIC_DEFAULT_REGION: ${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
          PUBLIC_WEB_NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          WEB_VITE_API_URL: ${{ vars.VITE_API_URL }}
          WEB_VITE_PUBLIC_WEB_URL: ${{ vars.VITE_PUBLIC_WEB_URL }}
        run: |
          : "${IMAGE_REPOSITORY:?Set DOCKERHUB_IMAGE to a Docker Hub repository, e.g. 5715/nextpull}"
          if [[ "$IMAGE_REPOSITORY" == *:* || "$IMAGE_REPOSITORY" == *@* ]]; then
            echo "DOCKERHUB_IMAGE must be a repository without a tag or digest." >&2
            exit 1
          fi
          export APP_IMAGE="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker compose --env-file /dev/null -f infra/compose.build.yaml build bundle
          docker compose --env-file /dev/null -f infra/compose.build.yaml push bundle
          docker image tag "$APP_IMAGE" "$IMAGE_REPOSITORY:latest"
          docker image push "$IMAGE_REPOSITORY:latest"
